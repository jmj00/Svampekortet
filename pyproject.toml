[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svampekortet-pipeline"
version = "0.0.1"
description = "Data pipeline and probability model for Svampekortet"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "truststore>=0.9",  # trust the OS cert store (this machine's network does TLS inspection)
    "numpy>=2.0",
    "rasterio>=1.4",  # pipeline.ingest.host_tree -- windowed /vsicurl/ reads of remote COGs (ADR-0019)
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pre-commit>=3.7"]

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"
