name: deploy-review

# Deploys the internal species photo/description review tool (review/) to
# its own Cloudflare Pages project, separate from the main app's deploy.yml
# so it can never affect that build. Manual only: re-run by hand whenever
# photos or descriptions change -- there's no weekly schedule for this one.
#
# Needs one thing the main deploy doesn't: a Workers KV namespace bound in
# review/wrangler.toml, created once by hand in the Cloudflare dashboard
# (Storage & Databases -> KV) since there's no API-token-free way to
# provision a namespace. Everything else reuses the same
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as deploy.yml.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-review
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Build the review page
        run: python scripts/build_photo_review.py

      - name: Create the Pages project (first run only)
        # wrangler pages deploy does not auto-create the project -- fails
        # "Project not found" on a brand new project name. This errors on
        # every run after the first (the project already exists by then),
        # which is expected and fine to ignore.
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: review
          command: pages project create svampekortet-review --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: review
          command: pages deploy public --project-name=svampekortet-review
